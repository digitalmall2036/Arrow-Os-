name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ArrowOs.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowOs-apk
          path: out/ArrowOs.apk
          retention-days: 30

      # On the main branch, also publish the APK as the "latest" release so it can be
      # downloaded straight from the phone without unzipping anything.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/ArrowOs.apk \
            --target "$GITHUB_SHA" \
            --title "Arrow Os (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download ArrowOs.apk below and open it on your phone to install." \
            --prerelease
