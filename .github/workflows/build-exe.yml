name: Build EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Make EXE installer
        shell: powershell
        run: |
          mkdir out
          copy app\build\outputs\apk\debug\app-debug.apk out\ArrowOs.apk
          # Create a launcher that opens the APK with an Android emulator on Windows
          '@echo off
          echo Installing ArrowOs...
          echo Please install BlueStacks or Windows Subsystem for Android first, then drag ArrowOs.apk into it.
          start "" "ArrowOs.apk"
          pause' | Out-File -Encoding ascii out\Run-ArrowOs.bat
          # Pack APK + launcher into one EXE using 7-Zip SFX
          choco install 7zip -y
          & "C:\Program Files\7-Zip\7z.exe" a -sfx out\ArrowOs.exe out\ArrowOs.apk out\Run-ArrowOs.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ArrowOs-exe
          path: out/ArrowOs.exe
          retention-days: 30
